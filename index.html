<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>InstaBuild 3D</title>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#000}
#ui{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:4px;padding:6px 10px;background:rgba(0,0,0,.7);flex-wrap:wrap}
#ui button{padding:5px 10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#ccc;border-radius:4px;cursor:pointer;font:11px sans-serif}
#ui button:hover{background:rgba(255,255,255,.2);color:#fff}
#ui button.on{background:#c49a6c;color:#000}
#info{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);color:#fff;font:12px sans-serif;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px}
</style>
</head>
<body>
<div id="ui">
<button onclick="setTool('foundation')" id="b-f">Foundation</button>
<button onclick="setTool('wall')" id="b-w">Wall</button>
<button onclick="setTool('window')" id="b-n">Window</button>
<button onclick="setTool('door')" id="b-d">Door</button>
<button onclick="setTool('roof')" id="b-r">Roof</button>
<button onclick="setTool('floor')" id="b-l">Floor</button>
<button onclick="setTool('furniture')" id="b-u">Furniture</button>
<button onclick="autoBuild()" style="background:#2d8a4e;color:#fff;font-weight:bold">Auto Build</button>
<button onclick="clearAll()">Clear</button>
</div>
<div id="info">Foundation — Click ground to place | Right-drag: rotate | Scroll: zoom | WASD: walk | F: focus</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── SETUP ──
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,50,200);

const camera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.5,500);
camera.position.set(25,18,25);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

// ── LIGHTS ──
const sun=new THREE.DirectionalLight(0xfffdf0,4);
sun.position.set(40,35,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=0.5;sun.shadow.camera.far=150;
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;
sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xbcd4f0,1.8));
scene.add(new THREE.HemisphereLight(0xbcd4f0,0x4a6a3a,1.2));

// Dark green rich grass
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x3d6b2e,roughness:0.85})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Brown earth plot where house goes
const plot=new THREE.Mesh(
  new THREE.PlaneGeometry(14,16),
  new THREE.MeshStandardMaterial({color:0x8B6914,roughness:0.9})
);
plot.rotation.x=-Math.PI/2;plot.position.y=0.005;plot.receiveShadow=true;scene.add(plot);

// Black asphalt road with white stripes
const road=new THREE.Mesh(new THREE.PlaneGeometry(4,80),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.95}));
road.rotation.x=-Math.PI/2;road.position.set(20,0.02,0);road.receiveShadow=true;scene.add(road);
const line=new THREE.Mesh(new THREE.PlaneGeometry(0.15,80),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0x222222,emissiveIntensity:0.3}));
line.rotation.x=-Math.PI/2;line.position.set(18.8,0.03,0);scene.add(line);
const line2=line.clone();line2.position.x=21.2;scene.add(line2);

// ── SKY SPHERE ──
const skySphere=new THREE.Mesh(
  new THREE.SphereGeometry(90,32,32),
  new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(0x4a90d9)},bottom:{value:new THREE.Color(0xc8e8ff)}},
    vertexShader:'varying vec3 wpos;void main(){vec4 wp=modelMatrix*vec4(position,1.0);wpos=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 top,bottom;varying vec3 wpos;void main(){float h=normalize(wpos+vec3(0,30,0)).y;gl_FragColor=vec4(mix(bottom,top,smoothstep(0.0,1.0,h)),1.0);}',
    side:THREE.BackSide,depthWrite:false
  })
);
scene.add(skySphere);

// ── TREES ──
function addTree(x,z,s){
  s=s||1;
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.1*s,0.15*s,2*s,8),new THREE.MeshStandardMaterial({color:0x8B6914,roughness:0.7}));
  trunk.position.y=s;trunk.castShadow=true;g.add(trunk);
  [1.2,0.9,0.6].forEach((r,i)=>{
    const cone=new THREE.Mesh(new THREE.ConeGeometry(r*s,1.5*s,8),new THREE.MeshStandardMaterial({color:[0x2d6a2d,0x3a7a3a,0x4a8a4a][i],roughness:0.6}));
    cone.position.y=(2+i*1.4)*s;cone.castShadow=true;g.add(cone);
  });
  g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<30;i++)addTree(-40+Math.random()*80,-40+Math.random()*80,0.6+Math.random()*0.8);

// ── ORBIT CONTROLS ──
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2;controls.maxDistance=200;
controls.maxPolarAngle=Math.PI*0.48;
controls.mouseButtons={LEFT:null,MIDDLE:THREE.MOUSE.PAN,RIGHT:THREE.MOUSE.ROTATE};
controls.update();

// ── BUILDING ──
let tool='foundation',parts=[],furniture=[],previewMesh=null;
const GS=1; // grid size

function snap(v){return Math.round(v/GS)*GS}

function mkPreview(w,h,d){
  const g=new THREE.BoxGeometry(w||4,0.05,d||3);
  const m=new THREE.MeshBasicMaterial({color:0xc49a6c,opacity:0.4,transparent:true,depthTest:false,depthWrite:false});
  const mesh=new THREE.Mesh(g,m);mesh.renderOrder=999;
  return mesh;
}

function buildFoundation(x,z){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(8,0.25,10),new THREE.MeshStandardMaterial({color:0x6B4528,roughness:0.4}));
  m.position.y=0.125;m.castShadow=true;m.receiveShadow=true;g.add(m);
  g.position.set(snap(x),0,snap(z));g.userData={type:'foundation'};
  parts.push(g);scene.add(g);return g;
}

function buildWall(x,z,ry){
  ry=ry||0;
  const g=new THREE.Group();
  const b=new THREE.BoxGeometry(5,0.08,3);
  const m1=new THREE.Mesh(b,new THREE.MeshStandardMaterial({color:0xc4a060,roughness:0.5}));
  m1.position.y=1.5;m1.castShadow=true;g.add(m1);
  const m2=new THREE.Mesh(b.clone(),new THREE.MeshStandardMaterial({color:0xd4b896,roughness:0.45}));
  m2.position.y=3;m2.castShadow=true;g.add(m2);
  g.position.set(snap(x),0,snap(z));g.rotation.y=ry;
  g.userData={type:'wall'};parts.push(g);scene.add(g);return g;
}

function buildWindow(x,z,ry){
  ry=ry||0;
  const g=new THREE.Group();
  const f=new THREE.Mesh(new THREE.BoxGeometry(0.12,2,1.8),new THREE.MeshStandardMaterial({color:0x8B6914,roughness:0.3}));
  f.position.y=1.5;f.castShadow=true;g.add(f);
  const gl=new THREE.Mesh(new THREE.BoxGeometry(0.06,1.7,1.5),new THREE.MeshStandardMaterial({color:0xd8e8ff,roughness:0.1,transparent:true,opacity:0.7}));
  gl.position.y=1.5;g.add(gl);
  g.position.set(snap(x),0,snap(z));g.rotation.y=ry;
  g.userData={type:'window'};parts.push(g);scene.add(g);return g;
}

function buildDoor(x,z,ry){
  ry=ry||0;
  const g=new THREE.Group();
  const d=new THREE.Mesh(new THREE.BoxGeometry(0.2,3,0.9),new THREE.MeshStandardMaterial({color:0x5c3a1e,roughness:0.25}));
  d.position.y=1.5;d.castShadow=true;g.add(d);
  g.position.set(snap(x),0,snap(z));g.rotation.y=ry;
  g.userData={type:'door'};parts.push(g);scene.add(g);return g;
}

function buildRoof(x,z){
  const g=new THREE.Group();
  const shape=new THREE.Shape();
  shape.moveTo(-4.5,0);shape.lineTo(-3.5,0.8);shape.lineTo(0,3);shape.lineTo(3.5,0.8);shape.lineTo(4.5,0);shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{steps:1,depth:10.5,bevelEnabled:false});
  geo.translate(0,0,-5.25);geo.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x5C3A1E,roughness:0.45}));
  m.position.set(snap(x),3.08,snap(z));m.castShadow=true;g.add(m);
  g.userData={type:'roof'};parts.push(g);scene.add(g);return g;
}

function buildFloor(x,z){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(7,0.04,9),new THREE.MeshStandardMaterial({color:0xb8956a,roughness:0.25}));
  m.position.y=0.02;m.receiveShadow=true;g.add(m);
  g.position.set(snap(x),0.01,snap(z));
  g.userData={type:'floor'};parts.push(g);scene.add(g);return g;
}

function buildFurniture(x,z,type){
  const g=new THREE.Group();
  const types={
    sofa:()=>{
      const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.9),new THREE.MeshStandardMaterial({color:0x6a5a4a,roughness:0.45}));
      b.position.y=0.25;b.castShadow=true;g.add(b);
    },
    table:()=>{
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.65,0.04,24),new THREE.MeshStandardMaterial({color:0xa08060,roughness:0.25}));
      t.position.y=0.7;t.castShadow=true;g.add(t);
    },
    plant:()=>{
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.1,0.9,8),new THREE.MeshStandardMaterial({color:0x8B4513}));
      p.position.y=0.45;p.castShadow=true;g.add(p);
      const l=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,6),new THREE.MeshStandardMaterial({color:0x2a7a2a,roughness:0.5}));
      l.position.y=1.1;l.castShadow=true;g.add(l);
    }
  };
  if(types[type])types[type]();
  g.position.set(snap(x),0,snap(z));
  g.userData={type:'furniture',fType:type};furniture.push(g);scene.add(g);return g;
}

function autoBuild(){
  clearAll();
  const x=0,z=0;
  buildFoundation(x,z);
  buildWall(x-2.5,z,0);
  buildWall(x+2.5,z,0);
  buildWall(x,z-3,Math.PI/2);
  buildWall(x,z+3,Math.PI/2);
  buildWindow(x,z-3,Math.PI/2);
  buildWindow(x,z+3,Math.PI/2);
  buildDoor(x+2.6,z);
  buildRoof(x,z);
  buildFloor(x,z);
  buildFurniture(x-1.5,z+1,'sofa');
  buildFurniture(x+1,z+1,'table');
  buildFurniture(x-2,z-1,'plant');
  document.getElementById('info').textContent='House built! Right-drag to rotate, scroll to zoom, WASD to walk';
}

function clearAll(){
  parts.forEach(p=>scene.remove(p));
  furniture.forEach(f=>scene.remove(f));
  parts=[];furniture=[];
}

// ── CLICK TO PLACE ──
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

renderer.domElement.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(ground);
  if(hits.length&&tool!=='furniture'){
    const p=hits[0].point;
    const w=tool==='foundation'?8:tool==='wall'?5:tool==='window'?0.12:tool==='door'?0.2:tool==='roof'?8:tool==='floor'?7:4;
    const d=tool==='foundation'?10:tool==='wall'?3:tool==='window'?1.8:tool==='door'?0.9:tool==='roof'?10:tool==='floor'?9:3;
    if(!previewMesh){previewMesh=mkPreview(w,0.05,d);scene.add(previewMesh);}
    previewMesh.position.set(snap(p.x),0.01,snap(p.z));
  }else if(previewMesh){scene.remove(previewMesh);previewMesh=null;}
});

renderer.domElement.addEventListener('click',e=>{
  if(e.button!==0)return;
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(ground);
  if(!hits.length)return;
  const p=hits[0].point;
  if(tool==='foundation')buildFoundation(p.x,p.z);
  else if(tool==='wall')buildWall(p.x,p.z);
  else if(tool==='window')buildWindow(p.x,p.z);
  else if(tool==='door')buildDoor(p.x,p.z);
  else if(tool==='roof')buildRoof(p.x,p.z);
  else if(tool==='floor')buildFloor(p.x,p.z);
  else if(tool==='furniture'){
    const types=['sofa','table','plant'];
    buildFurniture(p.x,p.z,types[Math.floor(Math.random()*3)]);
  }
});

// ── KEYBOARD ──
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='f'||e.key==='F'){controls.target.set(0,1.5,0);camera.position.set(25,18,25);controls.update();}
  if(e.key>='1'&&e.key<='7'){const tl=['foundation','wall','window','door','roof','floor','furniture'];setTool(tl[parseInt(e.key)-1]);}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

// ── WASD WALK ──
function walk(){
  const sp=0.12;
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();
  const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
  const pos=camera.position.clone(),tgt=controls.target.clone();
  if(keys.w){pos.addScaledVector(dir,sp);tgt.addScaledVector(dir,sp);}
  if(keys.s){pos.addScaledVector(dir,-sp);tgt.addScaledVector(dir,-sp);}
  if(keys.a){pos.addScaledVector(right,-sp);tgt.addScaledVector(right,-sp);}
  if(keys.d){pos.addScaledVector(right,sp);tgt.addScaledVector(right,sp);}
  const d=pos.distanceTo(tgt);
  if(d<controls.maxDistance&&d>controls.minDistance){camera.position.copy(pos);controls.target.copy(tgt);}
}

function setTool(t){
  tool=t;
  document.querySelectorAll('#ui button[id]').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById('b-'+t[0]);
  if(el)el.classList.add('on');
  if(previewMesh){scene.remove(previewMesh);previewMesh=null;}
  document.getElementById('info').textContent=t.charAt(0).toUpperCase()+t.slice(1)+' — Click ground to place';
}

// ── RENDER LOOP ──
function animate(){
  requestAnimationFrame(animate);
  walk();
  controls.update();
  renderer.render(scene,camera);
}
animate();

// ── RESIZE ──
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

setTool('foundation');
</script>
</body>
</html>
