<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>InstaBuild 3D — House Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Inter',sans-serif}
#cv{display:block}
#ui{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none}
#top{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem;background:rgba(0,0,0,.8);pointer-events:all}
#top button{padding:.3rem .7rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccc;font-size:.7rem;cursor:pointer;font-family:inherit;transition:all .15s}
#top button:hover{background:rgba(255,255,255,.1);color:#fff}
#top button.sel{background:#c49a6c;color:#000;border-color:#c49a6c}
#info{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#ccc;padding:.4rem 1rem;border-radius:20px;font-size:.7rem;pointer-events:none;z-index:10}
#info span{color:#c49a6c}
#help{position:fixed;top:50%;right:1rem;transform:translateY(-50%);background:rgba(0,0,0,.7);color:#999;padding:.6rem .8rem;border-radius:8px;font-size:.6rem;line-height:1.6;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
<div id="top">
<span style="color:#c49a6c;font-weight:700;font-size:.75rem;margin-right:.5rem">🏗️ InstaBuild 3D</span>
<button id="b-foundation" class="sel" onclick="setTool('foundation')">🧱 Foundation</button>
<button id="b-wall" onclick="setTool('wall')">🧱 Wall</button>
<button id="b-window" onclick="setTool('window')">🪟 Window</button>
<button id="b-door" onclick="setTool('door')">🚪 Door</button>
<button id="b-roof" onclick="setTool('roof')">🏠 Roof</button>
<button id="b-floor" onclick="setTool('floor')">🪵 Floor</button>
<button id="b-furniture" onclick="setTool('furniture')">🛋️ Furniture</button>
<span style="flex:1"></span>
<button id="b-rotate" onclick="rotMode=!rotMode;this.classList.toggle('sel',rotMode)">🔄 Rotate</button>
<button id="b-delete" onclick="delMode=!delMode;this.classList.toggle('sel',delMode)">🗑️ Delete</button>
<button onclick="focusHouse()">🔍 Focus</button>
</div>
</div>
<div id="info"><span id="info-txt">🧱 Foundation — Click ground to place</span></div>
<div id="help">🖱️ Left Click: Place<br>🖱️ Right Drag: Rotate<br>🖱️ Scroll: Zoom<br>R: Rotate object<br>⌫: Delete mode<br>F: Focus view</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const cv=document.getElementById('cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!0});
renderer.shadowMap.enabled=!0;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#87CEEB');scene.fog=new THREE.Fog('#87CEEB',50,200);

const camera=new THREE.PerspectiveCamera(55,2,0.5,300);
camera.position.set(25,18,25);camera.lookAt(0,0,0);

const controls=new OrbitControls(camera,cv);
controls.target.set(0,1,0);controls.enableDamping=!0;controls.dampingFactor=.08;
controls.minDistance=3;controls.maxDistance=80;controls.maxPolarAngle=Math.PI*.48;
controls.mouseButtons={LEFT:null,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE};
controls.update();

// Lighting
const sun=new THREE.DirectionalLight('#fffdf0',4.5);sun.position.set(30,25,10);
sun.castShadow=!0;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=.5;sun.shadow.camera.far=100;
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.bias=-.0004;scene.add(sun);

const ambient=new THREE.AmbientLight('#bcc8e8',1.2);scene.add(ambient);
const hemi=new THREE.HemisphereLight('#87CEEB','#3a5a2a',.8);scene.add(hemi);

// Ground
const groundGeo=new THREE.PlaneGeometry(120,120);
const groundMat=new THREE.MeshStandardMaterial({color:'#4a7a2a',roughness:.9});
const ground=new THREE.Mesh(groundGeo,groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=!0;scene.add(ground);

// Grid
const grid=new THREE.GridHelper(60,60,'#555','#444');grid.position.y=.01;scene.add(grid);

// Trees
function addTree(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,3,8),new THREE.MeshStandardMaterial({color:'#8B6914',roughness:.8}));
  trunk.position.y=1.5;trunk.castShadow=!0;g.add(trunk);
  const c1=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.5,8),new THREE.MeshStandardMaterial({color:'#2d6a2d',roughness:.7}));
  c1.position.y=3.5;c1.castShadow=!0;g.add(c1);
  const c2=new THREE.Mesh(new THREE.ConeGeometry(1,2,8),new THREE.MeshStandardMaterial({color:'#3a8a3a',roughness:.7}));
  c2.position.y=5;c2.castShadow=!0;g.add(c2);
  g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<25;i++){addTree(-25+Math.random()*50,-25+Math.random()*50)}

// Road
const road=new THREE.Mesh(new THREE.PlaneGeometry(4,60),new THREE.MeshStandardMaterial({color:'#444',roughness:1}));
road.rotation.x=-Math.PI/2;road.position.set(20,.02,0);road.receiveShadow=!0;scene.add(road);

// Sky dome
const skyGeo=new THREE.SphereGeometry(80,32,32);
const skyMat=new THREE.ShaderMaterial({uniforms:{topColor:{value:new THREE.Color('#4a90d9')},bottomColor:{value:new THREE.Color('#c8ddf0')},offset:{value:20},exponent:{value:.6}},vertexShader:'varying vec3 vWorldPosition;void main(){vec4 wp=modelMatrix*vec4(position,1.);vWorldPosition=wp.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 topColor,bottomColor;uniform float offset,exponent;varying vec3 vWorldPosition;void main(){float h=normalize(vWorldPosition+offset).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.),exponent),0.)),1.);}',side:THREE.BackSide});
const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);

// Building state
let tool='foundation',rotMode=!1,delMode=!1,buildings=[],preview=null,furniture=[];
const gridSize=1;

function setTool(t){tool=t;rotMode=!1;delMode=!1;document.getElementById('b-delete').classList.remove('sel');document.getElementById('b-rotate').classList.remove('sel');document.querySelectorAll('#top button[id^=b-]').forEach(b=>b.classList.remove('sel'));document.getElementById('b-'+t).classList.add('sel');updateInfo()}
function updateInfo(){const m={foundation:'🧱 Foundation — Click ground to place',wall:'🧱 Wall — Click to build up',window:'🪟 Window — Click wall to place',door:'🚪 Door — Click wall to place',roof:'🏠 Roof — Click top to cap',floor:'🪵 Floor — Click inside',furniture:'🛋️ Furniture — Click to place'};document.getElementById('info-txt').textContent=delMode?'🗑️ Delete mode — Click object to remove':m[tool]||''}
window.setTool=setTool;

// Raycaster
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function getIntersection(e,objects){
  const r=cv.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  return raycaster.intersectObjects(objects,!1);
}

// Build functions
function snap(v){return Math.round(v/gridSize)*gridSize}

function createFoundation(x,z){
  const g=new THREE.Group();g.name='foundation';g.userData={type:'foundation'};
  const geo=new THREE.BoxGeometry(6,.3,8);const mat=new THREE.MeshStandardMaterial({color:'#999',roughness:.6});
  const m=new THREE.Mesh(geo,mat);m.position.y=.15;m.castShadow=!0;m.receiveShadow=!0;g.add(m);
  g.position.set(snap(x),0,snap(z));scene.add(g);buildings.push(g);return g;
}

function createWall(x,y,z,ry=0){
  const g=new THREE.Group();g.name='wall';g.userData={type:'wall'};
  const geo=new THREE.BoxGeometry(4,.1,3);const mat=new THREE.MeshStandardMaterial({color:'#c49a6c',roughness:.5});
  const m=new THREE.Mesh(geo,mat);m.castShadow=!0;m.receiveShadow=!0;g.add(m);
  g.position.set(snap(x),y,snap(z));g.rotation.y=ry;scene.add(g);buildings.push(g);return g;
}

function createWindow(x,y,z,ry=0){
  const g=new THREE.Group();g.name='window';g.userData={type:'window'};
  const frame=new THREE.Mesh(new THREE.BoxGeometry(.1,1.5,1.2),new THREE.MeshStandardMaterial({color:'#8B6914',roughness:.4}));
  frame.castShadow=!0;g.add(frame);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(.05,1.3,.9),new THREE.MeshPhysicalMaterial({color:'#c8ddf0',roughness:.1,metalness:0,transmission:.3,opacity:.7,transparent:!0}));
  g.add(glass);
  g.position.set(snap(x),y,snap(z));g.rotation.y=ry;scene.add(g);buildings.push(g);return g;
}

function createDoor(x,y,z,ry=0){
  const g=new THREE.Group();g.name='door';g.userData={type:'door'};
  const geo=new THREE.BoxGeometry(.15,2.5,1);const mat=new THREE.MeshStandardMaterial({color:'#5c3a1e',roughness:.4});
  const m=new THREE.Mesh(geo,mat);m.position.y=1.25;m.castShadow=!0;g.add(m);
  // Handle
  const h=new THREE.Mesh(new THREE.SphereGeometry(.08),new THREE.MeshStandardMaterial({color:'#ffd700',roughness:.2,metalness:.8}));
  h.position.set(.1,1.4,.3);g.add(h);
  g.position.set(snap(x),0,snap(z));g.rotation.y=ry;scene.add(g);buildings.push(g);return g;
}

function createRoof(x,y,z){
  const g=new THREE.Group();g.name='roof';g.userData={type:'roof'};
  const shape=new THREE.Shape();shape.moveTo(-3.5,0);shape.lineTo(0,2.5);shape.lineTo(3.5,0);shape.closePath();
  const extrudeSettings={steps:1,depth:9,bevelEnabled:!1};
  const geo=new THREE.ExtrudeGeometry(shape,extrudeSettings);geo.translate(0,0,-4.5);geo.rotateX(-Math.PI/2);
  const mat=new THREE.MeshStandardMaterial({color:'#6B3513',roughness:.6});
  const m=new THREE.Mesh(geo,mat);m.position.set(snap(x),y,snap(z));m.castShadow=!0;m.receiveShadow=!0;
  g.add(m);scene.add(g);buildings.push(g);return g;
}

function createFloor(x,y,z){
  const g=new THREE.Group();g.name='floor';g.userData={type:'floor'};
  const geo=new THREE.BoxGeometry(5,.05,7);const mat=new THREE.MeshStandardMaterial({color:'#b8956a',roughness:.4});
  const m=new THREE.Mesh(geo,mat);m.position.y=.02;m.receiveShadow=!0;g.add(m);
  g.position.set(snap(x),y,snap(z));scene.add(g);buildings.push(g);return g;
}

function createFurniture(x,y,z,type){
  const g=new THREE.Group();g.name='furniture';g.userData={type:'furniture',fType:type};
  const items={
    sofa:()=>{const b=new THREE.BoxGeometry(2,.6,.8);const m=new THREE.Mesh(b,new THREE.MeshStandardMaterial({color:'#7a6050',roughness:.5}));m.position.y=.3;m.castShadow=!0;g.add(m)},
    table:()=>{const t=new THREE.CylinderGeometry(.6,.6,.05,16);const mt=new THREE.Mesh(t,new THREE.MeshStandardMaterial({color:'#8B6914',roughness:.3}));mt.position.y=.6;mt.castShadow=!0;g.add(mt);const l=new THREE.CylinderGeometry(.06,.06,.55,8);['#7a5a3a'].forEach(()=>{const ml=new THREE.Mesh(l,new THREE.MeshStandardMaterial({color:'#7a5a3a',roughness:.4}));ml.position.set(.35,.27,.35);ml.castShadow=!0;g.add(ml)})},
    chair:()=>{const s=new THREE.BoxGeometry(.5,.5,.5);const ms=new THREE.Mesh(s,new THREE.MeshStandardMaterial({color:'#6a5a4a',roughness:.5}));ms.position.y=.25;ms.castShadow=!0;g.add(ms);const b=new THREE.BoxGeometry(.5,.4,.05);const mb=new THREE.Mesh(b,new THREE.MeshStandardMaterial({color:'#8B6914',roughness:.5}));mb.position.set(0,.45,.25);g.add(mb)},
    lamp:()=>{const p=new THREE.CylinderGeometry(.05,.05,2,8);const mp=new THREE.Mesh(p,new THREE.MeshStandardMaterial({color:'#888',roughness:.3}));mp.position.y=1;mp.castShadow=!0;g.add(mp);const s=new THREE.SphereGeometry(.3);const ms=new THREE.Mesh(s,new THREE.MeshStandardMaterial({color:'#ffe8a0',roughness:.1,emissive:'#ffe8a0',emissiveIntensity:.5}));ms.position.y=2.1;g.add(ms)},
    plant:()=>{const p=new THREE.CylinderGeometry(.08,.1,.8,8);const mp=new THREE.Mesh(p,new THREE.MeshStandardMaterial({color:'#8B4513'}));mp.position.y=.4;mp.castShadow=!0;g.add(mp);const l=new THREE.SphereGeometry(.4);const ml=new THREE.Mesh(l,new THREE.MeshStandardMaterial({color:'#228B22',roughness:.6}));ml.position.y=1;ml.castShadow=!0;g.add(ml)},
    bed:()=>{const b=new THREE.BoxGeometry(1.6,.4,2);const mb=new THREE.Mesh(b,new THREE.MeshStandardMaterial({color:'#8B6914',roughness:.4}));mb.position.y=.2;mb.castShadow=!0;g.add(mb);const h=new THREE.BoxGeometry(1.6,.2,.15);const mh=new THREE.Mesh(h,new THREE.MeshStandardMaterial({color:'#eee',roughness:.6}));mh.position.set(0,.5,.85);g.add(mh)}
  };
  if(items[type])items[type]();
  g.position.set(snap(x),y,snap(z));scene.add(g);furniture.push(g);return g;
}

// Preview
function updatePreview(pos){
  if(preview){scene.remove(preview);preview=null}
  const px=snap(pos.x),py=pos.y,pz=snap(pos.z);
  const geo=new THREE.BoxGeometry(tool==='foundation'?6:tool==='door'?.15:tool==='window'?.1:4,.05,tool==='foundation'?8:tool==='door'?1:tool==='window'?1.2:3);
  const mat=new THREE.MeshBasicMaterial({color:'#c49a6c',opacity:.4,transparent:!0,depthTest:!1});
  preview=new THREE.Mesh(geo,mat);preview.position.set(px,py,pz);preview.renderOrder=999;preview.material.depthTest=!1;
  scene.add(preview);
}

// Click handler
cv.addEventListener('pointermove',e=>{
  if(delMode||!['foundation','wall','window','door','roof','floor','furniture'].includes(tool))return;
  const isects=getIntersection(e,[ground,...buildings]);
  if(isects.length>0){
    const p=isects[0].point;p.y=0;
    if(tool==='roof')p.y=3;if(tool==='wall'||tool==='window'||tool==='door')p.y=1.5;
    if(tool==='floor')p.y=.1;
    updatePreview(p);
  }else if(preview){scene.remove(preview);preview=null}
});

cv.addEventListener('click',e=>{
  if(e.button!==0)return;
  if(delMode){
    const all=[...buildings,...furniture];
    const isects=getIntersection(e,all);
    if(isects.length>0){
      const obj=isects[0].object;
      let parent=obj;while(parent.parent&&parent.parent!==scene)parent=parent.parent;
      scene.remove(parent);buildings=buildings.filter(b=>b!==parent);furniture=furniture.filter(f=>f!==parent);
    }
    return;
  }
  const isects=getIntersection(e,[ground,...buildings]);
  if(isects.length>0){
    const p=isects[0].point.clone();p.x=snap(p.x);p.z=snap(p.z);
    if(tool==='foundation')createFoundation(p.x,p.z);
    else if(tool==='wall')createWall(p.x,1.5,p.z);
    else if(tool==='window')createWindow(p.x,1.5,p.z);
    else if(tool==='door')createDoor(p.x,0,p.z);
    else if(tool==='roof')createRoof(p.x,3,p.z);
    else if(tool==='floor')createFloor(p.x,.1,p.z);
    else if(tool==='furniture'){const t=['sofa','table','chair','lamp','plant','bed'][Math.floor(Math.random()*6)];createFurniture(p.x,.1,p.z,t)}
  }
  if(preview){scene.remove(preview);preview=null}
});

// Keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){rotMode=!rotMode;document.getElementById('b-rotate').classList.toggle('sel',rotMode)}
  if(e.key==='Delete'||e.key==='Backspace'){delMode=!delMode;document.getElementById('b-delete').classList.toggle('sel',delMode);updateInfo()}
  if(e.key==='f'||e.key==='F')focusHouse();
  if(e.key>='1'&&e.key<='7'){const tl=['foundation','wall','window','door','roof','floor','furniture'];setTool(tl[parseInt(e.key)-1])}
});

function focusHouse(){
  if(buildings.length===0){controls.target.set(0,1,0);camera.position.set(25,18,25);controls.update();return}
  const box=new THREE.Box3();buildings.forEach(b=>box.expandByObject(b));
  const center=new THREE.Vector3();box.getCenter(center);const size=new THREE.Vector3();box.getSize(size);
  const maxDim=Math.max(size.x,size.y,size.z);const dist=maxDim*1.5;
  controls.target.copy(center);camera.position.set(center.x+dist*.7,center.y+dist*.5,center.z+dist*.7);controls.update();
}
window.focusHouse=focusHouse;

// Day/night
let time=0;
function animate(){
  requestAnimationFrame(animate);
  time+=.001;
  const t=Math.sin(time*.1)*.5+.5; // 0-1 cycle
  sun.intensity=2+3*t;
  ambient.intensity=.5+1*t;
  hemi.intensity=.3+.8*t;
  const skyTop=new THREE.Color().lerpColors(new THREE.Color('#1a1a3a'),new THREE.Color('#4a90d9'),t);
  const skyBot=new THREE.Color().lerpColors(new THREE.Color('#2a2a4a'),new THREE.Color('#c8ddf0'),t);
  sky.material.uniforms.topColor.value=skyTop;
  sky.material.uniforms.bottomColor.value=skyBot;
  scene.background=new THREE.Color().lerpColors(new THREE.Color('#1a2a3a'),new THREE.Color('#87CEEB'),t);
  scene.fog.color.copy(scene.background);
  controls.update();
  renderer.render(scene,camera);
}
animate();

// Resize
function resize(){renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

// Init
document.getElementById('b-foundation').classList.add('sel');
updateInfo();
</script>
</body>
</html>
